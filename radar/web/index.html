<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Internship Radar</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230d1319'/%3E%3Ccircle cx='16' cy='16' r='9' fill='none' stroke='%233ddc97' stroke-width='2'/%3E%3Ccircle cx='16' cy='16' r='3' fill='%233ddc97'/%3E%3Cpath d='M16 16 L24 9' stroke='%233ddc97' stroke-width='2' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/app.css">
</head>
<body>
  <div class="shell">
    <aside class="side">
      <div class="brand">
        <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true">
          <circle cx="16" cy="16" r="13" /><circle cx="16" cy="16" r="7" /><circle class="dot" cx="16" cy="16" r="2.4" />
          <path class="sweep" d="M16 16 L27 8" />
        </svg>
        <div>
          <div class="brand-name">Internship Radar</div>
          <div class="brand-sub" id="brandSub">PFE · Jan–Jun 2027</div>
        </div>
      </div>
      <nav class="nav" id="nav"></nav>
      <div class="side-foot">
        <div class="runbox" id="runbox"></div>
        <button class="btn primary block" id="runAll">Run all agents</button>
        <button class="btn ghost block" id="themeToggle" title="Switch between light and dark">Switch theme</button>
      </div>
    </aside>
    <main class="main">
      <header class="top">
        <div>
          <h1 id="viewTitle">Today</h1>
          <p class="sub" id="viewSub"></p>
        </div>
        <div class="top-actions" id="topActions"></div>
      </header>
      <section id="view" class="view" aria-live="polite"></section>
    </main>
  </div>
  <aside class="drawer" id="drawer" aria-hidden="true"></aside>
  <div class="scrim" id="scrim"></div>
  <div class="modal" id="modal" aria-hidden="true"></div>
  <div class="toasts" id="toasts"></div>
  <script src="/app.js"></script>
</body>
</html>
